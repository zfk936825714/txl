<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我们的同学录</title>
<style>
*{box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
body{background:#f8f5eb;max-width:520px;margin:30px auto;padding:0 20px;}
.box{background:#fff;padding:24px;border:1px solid #ddd;border-radius:4px;box-shadow:2px 2px 6px #ddd;}
input,textarea{width:100%;margin:8px 0;padding:10px;border:1px solid #ccc;border-radius:3px;}
button{padding:10px 20px;background:#557799;color:#fff;border:none;border-radius:3px;cursor:pointer;}
.msg-item{border-top:1px solid #eee;padding:12px 0;}
</style>
</head>
<body>
<div class="box">
<h2>📖 班级同学录</h2>
<p>写下你的名字和想留给大家的话</p>
<input id="name" placeholder="你的名字">
<textarea id="words" rows="3" placeholder="想写的留言..."></textarea>
<button onclick="addMsg()">提交留言</button>
<div id="list"></div>
</div>
<script>
function addMsg(){
let n=document.getElementById('name').value.trim();
let w=document.getElementById('words').value.trim();
if(!n||!w){alert('名字和留言都要写哦');return;}
let div=document.createElement('div');
div.className='msg-item';
div.innerHTML=`<strong>${n}</strong>：${w}`;
document.getElementById('list').appendChild(div);
document.getElementById('name').value='';
document.getElementById('words').value='';
}
</script>
</body>
</html>
